[project]
name = "sammtech-ai-engine"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.135,<1", "uvicorn>=0.42,<1", "pydantic>=2.12,<3", "httpx>=0.28,<1", "numpy>=2.2,<3", "scikit-learn>=1.6,<2"]
[project.optional-dependencies]
test = ["pytest>=8,<10", "pip-audit>=2.9,<3"]
local = ["sentence-transformers>=5,<6", "onnxruntime>=1.22,<2", "faster-whisper>=1.2,<2", "piper-tts>=1.3,<2"]
[tool.pytest.ini_options]
pythonpath = ["."]
[build-system]
requires = ["setuptools>=80,<83"]
build-backend = "setuptools.build_meta"
[tool.setuptools.packages.find]
include = ["app*"]
